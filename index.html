<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сотрудники</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
  body { background:#f0f2f5; min-height:100vh; }

  /* Шапка */
  .header { background:#1a73e8; color:#fff; padding:12px 20px; display:flex; align-items:center; gap:12px; }
  .header .account { margin-left:auto; background:rgba(255,255,255,.2); padding:8px 14px; border-radius:20px; cursor:pointer; }
  .btn-top { background:rgba(255,255,255,.2); color:#fff; border:none; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:14px; text-decoration:none; }
  .btn-top:hover { background:rgba(255,255,255,.35); }

  /* Вкладки */
  .tabs { display:flex; background:#fff; border-bottom:2px solid #ddd; }
  .tab { flex:1; padding:14px; text-align:center; cursor:pointer; color:#555; font-weight:bold; }
  .tab.active { color:#1a73e8; border-bottom:3px solid #1a73e8; }

  .page { display:none; padding:16px; max-width:700px; margin:0 auto; }
  .page.active { display:block; }

  /* Окошко заданий */
  .task-window { background:#fff; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .task-row { padding:14px 16px; border-bottom:1px solid #eee; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .task-row:hover { background:#f5f8ff; }
  .status-done { color:#2e7d32; font-weight:bold; }
  .status-not { color:#c62828; font-weight:bold; }
  .task-detail { padding:18px; }
  .task-detail h3 { margin-bottom:8px; }
  .task-detail p { margin-bottom:10px; color:#444; }
  .meta { font-size:14px; color:#666; margin-bottom:6px; }
  .btn { padding:10px 18px; border:none; border-radius:8px; cursor:pointer; font-size:14px; margin-right:8px; margin-top:8px; }
  .btn-blue { background:#1a73e8; color:#fff; }
  .btn-gray { background:#e0e0e0; color:#333; }
  .btn-red { background:#e53935; color:#fff; }
  .btn-green { background:#43a047; color:#fff; }

  .under { margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .under-row { display:flex; align-items:center; gap:10px; }

  .busy-box { background:#fff; border-radius:10px; padding:16px; margin-top:12px; box-shadow:0 2px 6px rgba(0,0,0,.15); display:none; }
  .busy-item { display:flex; justify-content:space-between; padding:6px 0; }

  /* Чат */
  .chat-box { background:#fff; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,.15); display:flex; flex-direction:column; height:60vh; }
  .chat-msgs { flex:1; overflow-y:auto; padding:14px; }
  .msg { max-width:70%; padding:8px 12px; border-radius:14px; margin-bottom:8px; font-size:14px; }
  .msg.me { background:#1a73e8; color:#fff; margin-left:auto; }
  .msg.other { background:#e3eaf3; color:#222; }
  .chat-input { display:flex; border-top:1px solid #ddd; }
  .chat-input input { flex:1; border:none; padding:12px; font-size:14px; outline:none; }
  .chat-input button { border:none; background:#1a73e8; color:#fff; padding:0 20px; cursor:pointer; }

  .link-item { background:#fff; border-radius:10px; padding:14px 16px; margin-bottom:10px; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .link-item a { color:#1a73e8; text-decoration:none; font-weight:bold; }

  .holiday { margin-top:18px; background:#fff3e0; border-radius:10px; padding:16px; text-align:center; font-size:16px; }
  .holiday b { font-size:20px; color:#e65100; }
  .countdown { margin-top:6px; font-size:15px; color:#555; }
  .save-hint { font-size:13px; color:#888; margin-top:6px; }
</style>
</head>
<body>

<div class="header">
  <a href="1.html"><button class="btn-top">Темперамент</button></a>
  <div class="account" id="account">Имя Фамилия</div>
</div>

<div class="tabs">
  <div class="tab active" data-page="page-tasks">Задания</div>
  <div class="tab" data-page="page-chats">Чаты</div>
  <div class="tab" data-page="page-links">Ссылки</div>
</div>

<!-- ===== ВКЛАДКА 1: ЗАДАНИЯ ===== -->
<div class="page active" id="page-tasks">
  <div class="task-window">
    <div id="task-list"></div>
    <div class="task-detail" id="task-detail" style="display:none;">
      <h3 id="d-title"></h3>
      <p id="d-desc"></p>
      <div class="meta">С: <span id="d-from"></span></div>
      <div class="meta">До: <span id="d-to"></span> &nbsp;|&nbsp; Важность: <b id="d-priority"></b></div>
      <div class="meta">Рейтинг работы: <b id="d-rating"></b></div>
      <label><input type="checkbox" id="d-done"> Выполнено</label><br>
      <button class="btn btn-red" onclick="cancelTask()">Не могу</button>
      <button class="btn btn-gray" onclick="backToList()">Назад</button>
    </div>
  </div>

  <button class="btn btn-blue" style="margin-top:16px;" onclick="toggleBusy()">Дни занятости</button>
  <button class="btn btn-green" id="save-btn" onclick="saveToDataJs()">Сохранить в data.js</button>
  <div class="save-hint" id="save-hint"></div>

  <div class="busy-box" id="busy-box">
    <b>Укажите дни, когда вы не сможете работать:</b><br>
    <input type="date" id="busy-date">
    <button class="btn btn-green" onclick="addBusy()">Добавить</button>
    <div id="busy-list"></div>
  </div>

  <div class="under">
    <div class="under-row">
      <b>Лента</b>
      <button class="btn btn-blue" onclick="window.open(LENTA_URL)">Открыть ленту</button>
    </div>
    <div class="under-row">
      <button class="btn btn-gray" onclick="window.location.href='mailto:'+REVIEWS_EMAIL">Написать отзыв</button>
    </div>
    <div class="under-row">
      <button class="btn btn-blue" onclick="window.open(SECOND_SITE_URL)">Перейти на сайт</button>
    </div>
    <div class="holiday">
      До праздника: <b id="h-name"></b>
      <div class="countdown" id="countdown"></div>
    </div>
  </div>
</div>

<!-- ===== ВКЛАДКА 2: ЧАТЫ ===== -->
<div class="page" id="page-chats">
  <div class="chat-box">
    <div class="chat-msgs" id="chat-msgs"></div>
    <div class="chat-input">
      <input type="text" id="chat-text" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<!-- ===== ВКЛАДКА 3: ССЫЛКИ ===== -->
<div class="page" id="page-links">
  <div id="links-list"></div>
</div>

<script src="data.js"></script>
<script>
// ---------- ВКЛАДКИ ----------
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById(t.dataset.page).classList.add('active');
});

// ---------- ЗАДАНИЯ ----------
// Источник истины — файл data.js. Всё меняется в нём, а не в памяти браузера.
// tasks копируем из TASKS и работаем дальше с tasks
let tasks = TASKS.map(t => ({...t}));
let currentId = null;

function renderList(){
  const box = document.getElementById('task-list');
  box.innerHTML = '';
  const visible = tasks.filter(t => !t.canceled);
  if (visible.length === 0) box.innerHTML = '<div class="task-row">Заданий нет</div>';
  visible.forEach(t => {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML = `<span>${t.title}</span>
      <span class="${t.done ? 'status-done' : 'status-not'}">${t.done ? 'Готово' : 'Не готово'}</span>`;
    row.onclick = () => openTask(t.id);
    box.appendChild(row);
  });
}

function openTask(id){
  currentId = id;
  const t = tasks.find(x => x.id === id);
  document.getElementById('task-list').style.display = 'none';
  document.getElementById('task-detail').style.display = 'block';
  document.getElementById('d-title').textContent = t.title;
  document.getElementById('d-desc').textContent = t.desc;
  document.getElementById('d-from').textContent = t.from;
  document.getElementById('d-to').textContent = t.to;
  document.getElementById('d-priority').textContent = t.priority;
  document.getElementById('d-rating').textContent = t.rating + ' / 5';
  document.getElementById('d-done').checked = t.done;
  document.getElementById('d-done').onchange = e => { t.done = e.target.checked; markDirty(); };
}

function backToList(){
  document.getElementById('task-detail').style.display = 'none';
  document.getElementById('task-list').style.display = 'block';
  renderList();
}

function cancelTask(){
  const t = tasks.find(x => x.id === currentId);
  t.canceled = true;
  markDirty();
  backToList();
}

// ---------- ДНИ ЗАНЯТОСТИ ----------
// Тоже живут в data.js (BUSY_DAYS)
let busyDays = (typeof BUSY_DAYS !== 'undefined') ? [...BUSY_DAYS] : [];

function toggleBusy(){
  const b = document.getElementById('busy-box');
  b.style.display = b.style.display === 'none' ? 'block' : 'none';
  renderBusy();
}
function addBusy(){
  const d = document.getElementById('busy-date').value;
  if (d && !busyDays.includes(d)) { busyDays.push(d); markDirty(); renderBusy(); }
}
function removeBusy(d){
  busyDays = busyDays.filter(x => x !== d); markDirty(); renderBusy();
}
function renderBusy(){
  document.getElementById('busy-list').innerHTML =
    busyDays.map(d => `<div class="busy-item"><span>${d}</span><span class="status-not" style="cursor:pointer" onclick="removeBusy('${d}')">✕</span></div>`).join('') || '<div class="busy-item" style="color:#999">Пока ничего не указано</div>';
}

// ---------- СОХРАНЕНИЕ В ФАЙЛ data.js ----------
let dirty = false;
function markDirty(){
  dirty = true;
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Сохранить в data.js •';
  document.getElementById('save-hint').textContent = 'Есть несохранённые изменения';
}

async function saveToDataJs(){
  // Собираем новое содержимое файла data.js со всеми изменениями
  const content =
    '// ===== ЗАДАНИЯ (босс задаёт title, desc, from, to, priority, rating) =====\n' +
    '// done — галочка работника, canceled — нажал "Не могу". Не редактировать руками.\n' +
    'const TASKS = ' + JSON.stringify(tasks, null, 2) + ';\n\n' +
    '// ===== ДНИ ЗАНЯТОСТИ =====\n' +
    'const BUSY_DAYS = ' + JSON.stringify(busyDays, null, 2) + ';\n\n' +
    '// ===== ПРАЗДНИКИ (задаёт босс) =====\n' +
    'const HOLIDAYS = ' + JSON.stringify(HOLIDAYS, null, 2) + ';\n\n' +
    '// ===== ССЫЛКИ (четвёртый документ) =====\n' +
    'const LINKS = ' + JSON.stringify(LINKS, null, 2) + ';\n\n' +
    '// ===== ВСТАВЬТЕ СВОИ АДРЕСА СЮДА =====\n' +
    'const LENTA_URL = ' + JSON.stringify(LENTA_URL) + ';\n' +
    'const REVIEWS_EMAIL = ' + JSON.stringify(REVIEWS_EMAIL) + ';\n' +
    'const SECOND_SITE_URL = ' + JSON.stringify(SECOND_SITE_URL) + ';\n';

  // Современные браузеры умеют перезаписывать реальный файл на диске
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'data.js',
        types: [{ description: 'JS файл', accept: { 'text/javascript': ['.js'] } }]
      });
      const w = await handle.createWritable();
      await w.write(content);
      await w.close();
      dirty = false;
      document.getElementById('save-btn').textContent = 'Сохранить в data.js';
      document.getElementById('save-hint').textContent = 'Сохранено в data.js ✔';
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // пользователь отменил — ничего не делаем
    }
  }

  // Запасной вариант: скачивается файл data.js, его нужно положить на место старого
  const blob = new Blob([content], {type: 'text/javascript;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.js';
  a.click();
  document.getElementById('save-hint').textContent = 'Скачан data.js — замените им старый файл в папке сайта';
}

// ---------- ЧАТ ----------
let chat = JSON.parse(localStorage.getItem('chat_v1') || '[]');
function renderChat(){
  const box = document.getElementById('chat-msgs');
  box.innerHTML = chat.map(m => `<div class="msg ${m.me ? 'me' : 'other'}">${m.text}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}
function sendMsg(){
  const inp = document.getElementById('chat-text');
  if (!inp.value.trim()) return;
  chat.push({ me:true, text: inp.value });
  inp.value = '';
  localStorage.setItem('chat_v1', JSON.stringify(chat));
  renderChat();
}

// ---------- ССЫЛКИ ----------
function renderLinks(){
  document.getElementById('links-list').innerHTML =
    LINKS.map(l => `<div class="link-item"><a href="${l.url}" target="_blank">${l.name}</a></div>`).join('');
}

// ---------- СЧЁТЧИК ДО ПРАЗДНИКА ----------
function nearestHoliday(){
  const now = new Date();
  return HOLIDAYS.map(h => ({...h, t: new Date(h.date + 'T00:00:00')}))
    .filter(h => h.t > now)
    .sort((a,b) => a.t - b.t)[0];
}
function tick(){
  const h = nearestHoliday();
  const el = document.getElementById('h-name');
  if (!h) { el.textContent = '—'; document.getElementById('countdown').textContent = 'Праздников больше нет'; return; }
  el.textContent = h.name;
  let diff = h.t - new Date();
  const d = Math.floor(diff / 86400000);
  const hh = Math.floor(diff / 3600000) % 24;
  const mm = Math.floor(diff / 60000) % 60;
  const ss = Math.floor(diff / 1000) % 60;
  document.getElementById('countdown').textContent = `${d} дн. ${hh} ч. ${mm} мин. ${ss} сек.`;
}

document.getElementById('account').textContent = localStorage.getItem('user_name') || 'Имя Фамилия';

renderList(); renderChat(); renderLinks(); renderBusy(); tick();
setInterval(tick, 1000);
</script>
</body>
</html>
